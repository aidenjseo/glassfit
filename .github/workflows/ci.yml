name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (dev group only — scan extra excluded, so no mediapipe)
        run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Full-stack check with real mediapipe + downloaded model. Manual trigger only:
  # the mediapipe dependency tree is heavy and its model download is an external fetch.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra scan
      - run: uv run python scripts/download_models.py
      - run: uv run pytest -m mediapipe -o addopts=""
